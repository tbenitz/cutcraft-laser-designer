<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CutCraft — Laser SVG Designer</title>
  <style>
    html,body{height:100%;margin:0;background:#101318;color:#f5f7fa;font-family:Inter,system-ui,sans-serif}
    .boot{display:grid;place-items:center;height:100%;text-align:center}
    .boot p{color:#98a2b3}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div><h1>CutCraft</h1><p>Loading designer…</p></div></div>
  <script>
    const parts = ["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-08.txt","part-09.txt","part-10.txt","part-11.txt","part-12.txt","part-13.txt"];
    Promise.all(parts.map(name => fetch("parts/" + name).then(r => {
      if (!r.ok) throw new Error("Missing " + name);
      return r.text();
    }))).then(chunks => {
      document.open();
      document.write(chunks.join(""));
      document.close();
    }).catch(err => {
      document.getElementById("boot").innerHTML = "<div><h1>CutCraft</h1><p>Could not load the designer. Use GitHub Pages or a local static server so the part files can be fetched.</p><p>" + err.message + "</p></div>";
    });
  </script>
</body>
</html>
